<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Распознавание рукописных цифр (MNIST)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 mb-2 text-center">Распознавание рукописной цифры</h1>
                    <p class="text-muted text-center mb-4">
                        Нарисуй цифру от 0 до 9 в квадратном окне и нажми «Распознать»
                    </p>

                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <div class="row g-4 align-items-start">
                        <!-- Левая колонка: холст для рисования -->
                        <div class="col-md-6 text-center">
                            <div class="canvas-wrapper mb-3">
                                <canvas id="digitCanvas" width="280" height="280"></canvas>
                            </div>

                            <div class="mb-3 px-3">
                                <label for="brushSize" class="form-label small text-muted mb-1">
                                    Толщина кисти: <span id="brushSizeValue">18</span> px
                                </label>
                                <input type="range" class="form-range" id="brushSize" min="10" max="30" value="18">
                            </div>

                            <div class="d-flex justify-content-center gap-2">
                                <button id="predictBtn" type="button" class="btn btn-primary px-4">
                                    Распознать
                                </button>
                                <button id="clearBtn" type="button" class="btn btn-outline-secondary px-4">
                                    Очистить
                                </button>
                            </div>
                        </div>

                        <!-- Правая колонка: результат и обратная связь -->
                        <div class="col-md-6">
                            <div id="placeholderCard" class="border rounded-3 p-4 text-center text-muted bg-light">
                                Результат распознавания появится здесь после отправки рисунка.
                            </div>

                            <div id="resultCard" class="d-none">
                                <div class="border rounded-3 p-4 text-center bg-light mb-3">
                                    <div class="small text-uppercase text-muted mb-1">Предсказание сети</div>
                                    <div id="predictedDigit" class="digit-badge text-primary mb-2">—</div>
                                    <div class="small text-muted">
                                        Уверенность: <strong id="confidenceText">0%</strong>
                                    </div>
                                </div>

                                <!-- Кнопки оценки результата -->
                                <div id="feedbackSection" class="border rounded-3 p-3 mb-3">
                                    <div class="fw-semibold mb-2 text-center">Сеть угадала цифру?</div>
                                    <div class="d-flex gap-2 justify-content-center mb-2">
                                        <button id="btnCorrect" type="button" class="btn btn-success flex-fill">
                                            Верно
                                        </button>
                                        <button id="btnIncorrect" type="button" class="btn btn-danger flex-fill">
                                            Не верно
                                        </button>
                                    </div>

                                    <!-- Уточнение правильной цифры при ошибке -->
                                    <div id="correctionBox" class="d-none mt-3 pt-2 border-top">
                                        <label for="trueDigitSelect" class="form-label small mb-1">
                                            Какая цифра была нарисована на самом деле?
                                        </label>
                                        <div class="input-group input-group-sm">
                                            <select id="trueDigitSelect" class="form-select">
                                                <option value="">Не указывать</option>
                                                <option value="0">0</option>
                                                <option value="1">1</option>
                                                <option value="2">2</option>
                                                <option value="3">3</option>
                                                <option value="4">4</option>
                                                <option value="5">5</option>
                                                <option value="6">6</option>
                                                <option value="7">7</option>
                                                <option value="8">8</option>
                                                <option value="9">9</option>
                                            </select>
                                            <button id="confirmIncorrectBtn" type="button" class="btn btn-outline-danger">
                                                Сохранить ошибку
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Распределение вероятностей по всем цифрам -->
                                <div>
                                    <div class="small fw-semibold text-muted mb-2">Оценки по классам (0–9):</div>
                                    <div id="probabilitiesList" class="vstack gap-1"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("digitCanvas");
    const ctx = canvas.getContext("2d");
    const brushSlider = document.getElementById("brushSize");
    const brushSizeValue = document.getElementById("brushSizeValue");

    const predictBtn = document.getElementById("predictBtn");
    const clearBtn = document.getElementById("clearBtn");
    const alertBox = document.getElementById("alertBox");

    const placeholderCard = document.getElementById("placeholderCard");
    const resultCard = document.getElementById("resultCard");
    const predictedDigitEl = document.getElementById("predictedDigit");
    const confidenceTextEl = document.getElementById("confidenceText");
    const probabilitiesListEl = document.getElementById("probabilitiesList");

    const feedbackSection = document.getElementById("feedbackSection");
    const btnCorrect = document.getElementById("btnCorrect");
    const btnIncorrect = document.getElementById("btnIncorrect");
    const correctionBox = document.getElementById("correctionBox");
    const trueDigitSelect = document.getElementById("trueDigitSelect");
    const confirmIncorrectBtn = document.getElementById("confirmIncorrectBtn");

    let isDrawing = false;
    let hasStrokes = false;
    let currentPrediction = null;
    let currentPendingFilename = null;

    // Инициализация чёрного фона холста и белой кисти
    function resetCanvas() {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#ffffff";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = Number(brushSlider.value);
        hasStrokes = false;
    }

    resetCanvas();

    brushSlider.addEventListener("input", () => {
        brushSizeValue.textContent = brushSlider.value;
        ctx.lineWidth = Number(brushSlider.value);
    });

    function getPointerPos(evt) {
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height),
        };
    }

    function startDraw(evt) {
        isDrawing = true;
        hasStrokes = true;
        const pos = getPointerPos(evt);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        // Ставим точку даже при одиночном клике
        ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
        ctx.stroke();
    }

    function draw(evt) {
        if (!isDrawing) return;
        const pos = getPointerPos(evt);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function stopDraw() {
        if (!isDrawing) return;
        isDrawing = false;
        ctx.closePath();
    }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    window.addEventListener("mouseup", stopDraw);

    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener("touchend", stopDraw);

    function showAlert(message, type = "info") {
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type}`;
    }

    function hideAlert() {
        alertBox.className = "alert d-none";
    }

    clearBtn.addEventListener("click", () => {
        resetCanvas();
        hideAlert();
        placeholderCard.classList.remove("d-none");
        resultCard.classList.add("d-none");
        correctionBox.classList.add("d-none");
        currentPrediction = null;
        currentPendingFilename = null;
    });

    function renderProbabilities(probs) {
        probabilitiesListEl.innerHTML = "";
        for (let d = 0; d <= 9; d++) {
            const p = (probs[String(d)] || 0) * 100;
            const row = document.createElement("div");
            row.className = "d-flex align-items-center gap-2 small";
            row.innerHTML = `
                <span class="prob-bar-label">${d}</span>
                <div class="progress flex-grow-1" style="height: 10px;">
                    <div class="progress-bar ${d === currentPrediction ? 'bg-primary' : 'bg-secondary'}"
                         style="width: ${p.toFixed(1)}%"></div>
                </div>
                <span class="text-muted text-end" style="width: 48px;">${p.toFixed(1)}%</span>
            `;
            probabilitiesListEl.appendChild(row);
        }
    }

    predictBtn.addEventListener("click", async () => {
        hideAlert();
        if (!hasStrokes) {
            showAlert("Сначала нарисуй цифру в чёрном квадрате.", "warning");
            return;
        }

        predictBtn.disabled = true;
        try {
            const imageData = canvas.toDataURL("image/png");
            const response = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image_data: imageData }),
            });
            const data = await response.json();

            if (!response.ok) {
                showAlert(data.error || "Ошибка при распознавании.", "danger");
                return;
            }

            currentPrediction = data.digit;
            currentPendingFilename = data.pending_filename;

            predictedDigitEl.textContent = data.digit;
            confidenceTextEl.textContent = `${(data.confidence * 100).toFixed(1)}%`;
            renderProbabilities(data.probabilities);

            placeholderCard.classList.add("d-none");
            resultCard.classList.remove("d-none");
            feedbackSection.classList.remove("d-none");
            correctionBox.classList.add("d-none");
            trueDigitSelect.value = "";
        } catch (err) {
            showAlert("Не удалось связаться с сервером.", "danger");
        } finally {
            predictBtn.disabled = false;
        }
    });

    async function sendFeedback(isCorrect, trueDigit = "") {
        if (!currentPendingFilename) return;
        try {
            const response = await fetch("/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    pending_filename: currentPendingFilename,
                    is_correct: isCorrect,
                    predicted_digit: currentPrediction,
                    true_digit: trueDigit,
                }),
            });
            const data = await response.json();
            if (!response.ok) {
                showAlert(data.error || "Не удалось сохранить оценку.", "danger");
                return;
            }

            showAlert(`Спасибо! ${data.message} (${data.saved_file})`, "success");
            feedbackSection.classList.add("d-none");
            currentPendingFilename = null;
        } catch (err) {
            showAlert("Ошибка при отправке оценки.", "danger");
        }
    }

    btnCorrect.addEventListener("click", () => {
        sendFeedback(true, String(currentPrediction));
    });

    btnIncorrect.addEventListener("click", () => {
        correctionBox.classList.remove("d-none");
    });

    confirmIncorrectBtn.addEventListener("click", () => {
        sendFeedback(false, trueDigitSelect.value);
    });
</script>
</body>
</html>
